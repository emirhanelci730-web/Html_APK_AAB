name: Build Android App (.AAB)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Uygulama Adi'
        required: true
        default: 'Benim Uygulamam'
      package_name:
        description: 'Paket Adi (örn: com.ornek.oyun)'
        required: true
        default: 'com.ornek.uygulama'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Ortami Hazirla ve Capacitor Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          node -v
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.package_name }}" --web-dir www
          npx cap add android

      - name: Gradle ile Play Store Uyumlu AAB Derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Olusan AAB Dosyasini Kaydet (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: play-store-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
