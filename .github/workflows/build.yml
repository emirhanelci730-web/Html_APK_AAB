name: Build Android AAB and APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Application Name'
        required: true
        type: string
      package_name:
        description: 'Android Package Name'
        required: true
        type: string
      job_id:
        description: 'Job ID'
        required: true
        type: string
      version_name:
        description: 'Version Name'
        required: false
        default: '1.0.0'
        type: string
      version_code:
        description: 'Version Code'
        required: false
        default: '1'
        type: string
      orientation:
        description: 'Screen Orientation'
        required: false
        default: 'unspecified'
        type: string
      permissions:
        description: 'Permissions JSON Array'
        required: false
        default: '[]'
        type: string
      fullscreen:
        description: 'Fullscreen Mode'
        required: false
        default: 'false'
        type: string
      has_icon:
        description: 'Has Custom Icon'
        required: false
        default: 'false'
        type: string
      sign_mode:
        description: 'Signing Mode'
        required: false
        default: 'new'
        type: string
      splash_color:
        description: 'Splash Background Color'
        required: false
        default: '#12161c'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download project archive from Worker
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          mkdir -p workspace/www
          curl -fsSL -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/zip/$JOB_ID" -o workspace/project.zip
          unzip -q workspace/project.zip -d workspace/www
          if [ ! -f workspace/www/index.html ]; then
            FIRST_HTML=$(find workspace/www -name "index.html" | head -n 1)
            if [ -n "$FIRST_HTML" ]; then
              cp "$FIRST_HTML" workspace/www/index.html
            fi
          fi

      - name: Prepare Capacitor project and install Google Auth plugin
        working-directory: workspace
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
        run: |
          npm init -y >/dev/null 2>&1
          npm install @capacitor/core @capacitor/cli @capacitor/android @codetrix-studio/capacitor-google-auth
          npx cap init "$APP_NAME" "$PACKAGE_NAME" --web-dir www --non-interactive
          npx cap add android

      - name: Copy google-services.json if available
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json workspace/android/app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > workspace/android/app/google-services.json
          fi

      - name: Configure Android manifest, splash and version
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          ORIENTATION: ${{ github.event.inputs.orientation }}
          FULLSCREEN: ${{ github.event.inputs.fullscreen }}
          SPLASH_COLOR: ${{ github.event.inputs.splash_color }}
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET

          manifest_path = "workspace/android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"

          app_elem = root.find("application")
          if app_elem is not None:
              app_elem.set(ns + "label", os.environ["APP_NAME"])

          for act in root.findall(".//activity"):
              if os.environ["ORIENTATION"] in ("portrait", "landscape", "unspecified"):
                  act.set(ns + "screenOrientation", os.environ["ORIENTATION"])

          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Sync Capacitor Android project
        working-directory: workspace
        run: |
          npx cap sync android

      - name: Build Android AAB and APK
        working-directory: workspace/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Upload build artifacts to Worker
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          AAB_PATH=$(find workspace/android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          APK_PATH=$(find workspace/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$AAB_PATH" ]; then
            curl -fsSL -X PUT \
              -H "X-Secret: $WORKER_SECRET" \
              --data-binary @"$AAB_PATH" \
              "$WORKER_URL/result/$JOB_ID?type=aab"
          fi
          if [ -n "$APK_PATH" ]; then
            curl -fsSL -X PUT \
              -H "X-Secret: $WORKER_SECRET" \
              --data-binary @"$APK_PATH" \
              "$WORKER_URL/result/$JOB_ID?type=apk"
          fi
