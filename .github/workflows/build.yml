name: Build Android App (.AAB)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Uygulama Adi'
        required: true
      package_name:
        description: 'Paket Adi'
        required: true
      job_id:
        description: 'Is kimligi (Worker verir)'
        required: true
      version_name:
        description: 'Surum adi'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Surum numarasi'
        required: true
        default: '1'
      orientation:
        description: 'Ekran yonu (portrait, landscape, unspecified)'
        required: true
        default: 'unspecified'
      camera:
        description: 'Kamera izni'
        required: false
        type: boolean
        default: true
      microphone:
        description: 'Mikrofon izni'
        required: false
        type: boolean
        default: true
      location:
        description: 'Konum izni'
        required: false
        type: boolean
        default: true
      vibration:
        description: 'Titresim izni'
        required: false
        type: boolean
        default: true
      fullscreen:
        description: 'Tam ekran (durum cubugunu gizle)'
        required: false
        type: boolean
        default: true
      has_icon:
        description: 'Ikon var mi (true, false)'
        required: true
        default: 'false'
      sign_mode:
        description: 'Imzalama (new, own)'
        required: true
        default: 'new'
      splash_color:
        description: 'Acilis ekrani rengi (#rrggbb)'
        required: true
        default: '#12161c'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ github.event.inputs.app_name }}
      PACKAGE_NAME: ${{ github.event.inputs.package_name }}
      JOB_ID: ${{ github.event.inputs.job_id }}
      SIGN_MODE: ${{ github.event.inputs.sign_mode }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}

    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Kullanicinin dosyasini al
        id: getfile
        run: |
          curl -s -m 10 -X POST -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/progress/$JOB_ID?stage=getfile" >/dev/null || true
          echo "$JOB_ID" | grep -Eq '^[0-9a-f-]{36}$' || { echo "Gecersiz is kimligi"; exit 1; }
          curl -sSf -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/zip/$JOB_ID" -o project.zip
          mkdir www
          if unzip -tq project.zip >/dev/null 2>&1; then
            unzip -q project.zip -d www
            rm -rf www/__MACOSX
            if [ ! -f www/index.html ]; then
              found=$(find www -name index.html | head -n 1)
              if [ -n "$found" ]; then
                dir=$(dirname "$found")
                mv "$dir" ./www_new && rm -rf www && mv www_new www
              else
                echo "HATA: ZIP icinde index.html yok"; exit 1
              fi
            fi
          else
            cp project.zip www/index.html
          fi
          ls www

      - name: Capacitor projesini hazirla
        id: cap
        run: |
          curl -s -m 10 -X POST -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/progress/$JOB_ID?stage=cap" >/dev/null || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "$APP_NAME" "$PACKAGE_NAME" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Surum, yon ve ikon ayarla
        id: settings
        env:
          VNAME: ${{ github.event.inputs.version_name }}
          VCODE: ${{ github.event.inputs.version_code }}
          ORI: ${{ github.event.inputs.orientation }}
          CAMERA: ${{ github.event.inputs.camera || 'true' }}
          MICROPHONE: ${{ github.event.inputs.microphone || 'true' }}
          LOCATION: ${{ github.event.inputs.location || 'true' }}
          VIBRATION: ${{ github.event.inputs.vibration || 'true' }}
          FULLSCREEN: ${{ github.event.inputs.fullscreen || 'true' }}
          HAS_ICON: ${{ github.event.inputs.has_icon }}
          SPLASH: ${{ github.event.inputs.splash_color }}
        run: |
          curl -s -m 10 -X POST -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/progress/$JOB_ID?stage=settings" >/dev/null || true
          echo "$VNAME" | grep -Eq '^[0-9A-Za-z._-]{1,20}$' || { echo "Gecersiz surum adi"; exit 1; }
          echo "$VCODE" | grep -Eq '^[0-9]{1,10}$' || { echo "Gecersiz surum numarasi"; exit 1; }
          case "$ORI" in portrait|landscape|unspecified) ;; *) echo "Gecersiz yon"; exit 1;; esac

          GRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VCODE/; s/versionName \"[^\"]*\"/versionName \"$VNAME\"/" "$GRADLE"
          grep -n "versionCode\|versionName" "$GRADLE"
          grep -q "versionCode $VCODE" "$GRADLE" || { echo "HATA: surum numarasi degismedi"; exit 1; }

          # AndroidManifest.xml izinlerini ve istege bagli donanim ozelliklerini ayarla.
          python3 - <<'PYXML'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          android = '{http://schemas.android.com/apk/res/android}'
          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          tree = ET.parse(manifest_path)
          root = tree.getroot()

          permissions = {
              'CAMERA': 'android.permission.CAMERA',
              'MICROPHONE': 'android.permission.RECORD_AUDIO',
              'LOCATION': 'android.permission.ACCESS_COARSE_LOCATION',
              'VIBRATION': 'android.permission.VIBRATE',
          }

          enabled = {
              key: os.getenv(key, 'false').lower() == 'true'
              for key in permissions
          }

          if enabled['LOCATION']:
              permissions['LOCATION_FINE'] = 'android.permission.ACCESS_FINE_LOCATION'

          existing = {
              node.get(android + 'name')
              for node in root.findall('uses-permission')
          }

          app_node = root.find('application')
          insert_at = list(root).index(app_node) if app_node is not None else len(root)

          for key, permission in permissions.items():
              if enabled.get(key, False) and permission not in existing:
                  root.insert(
                      insert_at,
                      ET.Element('uses-permission', {android + 'name': permission})
                  )
                  insert_at += 1

          features = []

          if enabled['CAMERA']:
              features.append('android.hardware.camera')

          if enabled['MICROPHONE']:
              features.append('android.hardware.microphone')

          existing_features = {
              node.get(android + 'name')
              for node in root.findall('uses-feature')
          }

          for feature in features:
              if feature not in existing_features:
                  root.insert(
                      insert_at,
                      ET.Element(
                          'uses-feature',
                          {
                              android + 'name': feature,
                              android + 'required': 'false'
                          }
                      )
                  )
                  insert_at += 1

          ET.register_namespace(
              'android',
              'http://schemas.android.com/apk/res/android'
          )

          tree.write(
              manifest_path,
              encoding='utf-8',
              xml_declaration=True
          )

          # Tam ekran secenegi: uygulama temasinda durum cubugunu gizler.
          if os.getenv('FULLSCREEN', 'false').lower() == 'true':
              styles_path = Path('android/app/src/main/res/values/styles.xml')
              styles_tree = ET.parse(styles_path)
              styles_root = styles_tree.getroot()

              app_themes = [
                  style for style in styles_root.findall('style')
                  if (style.get('name') or '').startswith('AppTheme')
              ]

              if not app_themes:
                  raise SystemExit(
                      'HATA: styles.xml icinde AppTheme bulunamadi'
                  )

              for app_theme in app_themes:
                  item = next(
                      (
                          item for item in app_theme.findall('item')
                          if item.get('name') == 'android:windowFullscreen'
                      ),
                      None
                  )

                  if item is None:
                      item = ET.SubElement(
                          app_theme,
                          'item',
                          {'name': 'android:windowFullscreen'}
                      )

                  item.text = 'true'

              styles_tree.write(
                  styles_path,
                  encoding='utf-8',
                  xml_declaration=True
              )

          print('Manifest izinleri:')

          for node in root.findall('uses-permission'):
              print('-', node.get(android + 'name'))

          PYXML

          if [ "$ORI" != "unspecified" ]; then
            sed -i "0,/<activity/s//<activity android:screenOrientation=\"$ORI\"/" android/app/src/main/AndroidManifest.xml
            grep -n "screenOrientation" android/app/src/main/AndroidManifest.xml
          fi

          echo "$SPLASH" | grep -Eq '^#[0-9A-Fa-f]{6}$' || { echo "Gecersiz acilis rengi"; exit 1; }

          SRES=android/app/src/main/res
          find "$SRES" -name 'splash.png' -delete
          mkdir -p "$SRES/drawable"

          printf '<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n    <solid android:color="%s"/>\n</shape>\n' "$SPLASH" > "$SRES/drawable/splash.xml"

          if grep -q "Theme.SplashScreen" "$SRES/values/styles.xml" && ! grep -q "windowSplashScreenBackground" "$SRES/values/styles.xml"; then
            sed -i "/AppTheme.NoActionBarLaunch/a <item name=\"windowSplashScreenBackground\">$SPLASH</item>" "$SRES/values/styles.xml"
          fi

          cat "$SRES/values/styles.xml"

          if [ "$HAS_ICON" = "true" ]; then
            sudo apt-get install -y imagemagick >/dev/null
            curl -sSf -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/icon/$JOB_ID" -o icon.png
            RES=android/app/src/main/res
            rm -rf "$RES/mipmap-anydpi-v26"

            for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              d=${pair%%:*}
              s=${pair##*:}

              for name in ic_launcher ic_launcher_round; do
                convert icon.png -resize ${s}x${s}^ -gravity center -extent ${s}x${s} "$RES/mipmap-$d/$name.png"
              done
            done

            echo "Ikon degistirildi"
          fi

      - name: Imzalama anahtarini hazirla
        id: keys
        run: |
          curl -s -m 10 -X POST -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/progress/$JOB_ID?stage=keys" >/dev/null || true
          KS="$RUNNER_TEMP/upload.jks"

          if [ "$SIGN_MODE" = "own" ]; then
            curl -sSf -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/sign/$JOB_ID" -o "$RUNNER_TEMP/sign.json"
            curl -sSf -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/ukeystore/$JOB_ID" -o "$KS"

            ALIAS=$(jq -r .alias "$RUNNER_TEMP/sign.json")
            SPASS=$(jq -r .storePass "$RUNNER_TEMP/sign.json")
            KPASS=$(jq -r .keyPass "$RUNNER_TEMP/sign.json")

            rm -f "$RUNNER_TEMP/sign.json"

            echo "::add-mask::$SPASS"
            echo "::add-mask::$KPASS"

            keytool -list -keystore "$KS" -storepass "$SPASS" -alias "$ALIAS" >/dev/null 2>&1 \
              || { echo "HATA: anahtar dosyasi, sifre veya takma ad yanlis"; exit 1; }

          else
            SPASS=$(openssl rand -hex 16)
            KPASS="$SPASS"
            ALIAS="upload"

            echo "::add-mask::$SPASS"

            keytool -genkeypair -storetype PKCS12 -keystore "$KS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SPASS" -keypass "$SPASS" -dname "CN=Android, C=TR" >/dev/null 2>&1
          fi

          FPOUT=$(keytool -list -v -keystore "$KS" -storepass "$SPASS" -alias "$ALIAS" 2>/dev/null || true)

          SHA1=$(printf '%s\n' "$FPOUT" | grep -m1 'SHA1:' | sed 's/.*SHA1: *//' | tr -d '[:space:]')
          SHA256=$(printf '%s\n' "$FPOUT" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d '[:space:]')

          if [ -n "$SHA1" ] && [ -n "$SHA256" ]; then
            curl -s -m 10 -X POST -H "X-Secret: $WORKER_SECRET" -H "Content-Type: application/json" \
              -d "{\"sha1\":\"$SHA1\",\"sha256\":\"$SHA256\"}" "$WORKER_URL/fp/$JOB_ID" >/dev/null || true
          fi

          if [ "$SIGN_MODE" = "new" ]; then
            printf 'Uygulama: %s\nPaket adi: %s\nTakma ad (alias): %s\nSHA-1: %s\nSHA-256: %s\nSifre: %s\n' \
              "$APP_NAME" "$PACKAGE_NAME" "$ALIAS" "$SHA1" "$SHA256" "$SPASS" > keyinfo.txt
          fi

          echo "ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KS_PASS=$SPASS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KPASS" >> "$GITHUB_ENV"

      - name: Gradle ile AAB ve APK derle
        id: gradle
        run: |
          curl -s -m 10 -X POST -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/progress/$JOB_ID?stage=gradle" >/dev/null || true
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: AAB ve APK dosyalarini imzala
        id: sign
        run: |
          curl -s -m 10 -X POST -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/progress/$JOB_ID?stage=sign" >/dev/null || true

          KS="$RUNNER_TEMP/upload.jks"
          JKP=""
          AKP=""

          if [ "$KEY_PASS" != "$KS_PASS" ]; then
            JKP="-keypass:env KEY_PASS"
            AKP="--key-pass env:KEY_PASS"
          fi

          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)

          jarsigner -keystore "$KS" -storepass:env KS_PASS $JKP \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            "$AAB" "$ALIAS"

          jarsigner -verify "$AAB"
          cp "$AAB" signed-release.aab

          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          "$BT/zipalign" -p -f 4 "$APK" aligned.apk

          "$BT/apksigner" sign --ks "$KS" \
            --ks-key-alias "$ALIAS" --ks-pass env:KS_PASS $AKP \
            --out signed-release.apk aligned.apk

          "$BT/apksigner" verify signed-release.apk

      - name: APK ve AAB dosyalarini GitHub'a yukle
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            signed-release.apk
            signed-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Dosyalari Worker'a gonder
        run: |
          curl -s -m 10 -X POST -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/progress/$JOB_ID?stage=send" >/dev/null || true

          if [ "$SIGN_MODE" = "new" ]; then
            curl -sSf -X PUT -H "X-Secret: $WORKER_SECRET" \
              --data-binary @"$RUNNER_TEMP/upload.jks" "$WORKER_URL/result/$JOB_ID?type=keystore"

            curl -sSf -X PUT -H "X-Secret: $WORKER_SECRET" \
              --data-binary @keyinfo.txt "$WORKER_URL/result/$JOB_ID?type=keyinfo"
          fi

          curl -sSf -X PUT -H "X-Secret: $WORKER_SECRET" \
            --data-binary @signed-release.apk "$WORKER_URL/result/$JOB_ID?type=apk"

          curl -sSf -X PUT -H "X-Secret: $WORKER_SECRET" \
            --data-binary @signed-release.aab "$WORKER_URL/result/$JOB_ID?type=aab"

      - name: Hata bildir
        if: failure()
        env:
          S_GET: ${{ steps.getfile.outcome }}
          S_CAP: ${{ steps.cap.outcome }}
          S_SET: ${{ steps.settings.outcome }}
          S_KEYS: ${{ steps.keys.outcome }}
          S_GRADLE: ${{ steps.gradle.outcome }}
          S_SIGN: ${{ steps.sign.outcome }}
        run: |
          MSG="Derleme beklenmedik bir sebeple basarisiz oldu."
          CODE="unknown"

          if [ "$S_GET" = "failure" ]; then
            MSG="Dosya acilamadi. ZIP bozuk olabilir ya da icinde index.html yok."
            CODE="getfile"
          fi

          if [ "$S_CAP" = "failure" ]; then
            MSG="Uygulama olusturulamadi. Uygulama adi veya paket adi gecersiz olabilir."
            CODE="cap"
          fi

          if [ "$S_SET" = "failure" ]; then
            MSG="Surum, yon, ikon veya acilis rengi ayarlanamadi. Ikon gecerli bir PNG olmayabilir."
            CODE="settings"
          fi

          if [ "$S_KEYS" = "failure" ]; then
            MSG="Imzalama anahtari acilamadi. Anahtar dosyasi, sifre veya takma ad yanlis olabilir."
            CODE="keys"
          fi

          if [ "$S_GRADLE" = "failure" ]; then
            MSG="Android derlemesi basarisiz oldu."
            CODE="gradle"
          fi

          if [ "$S_SIGN" = "failure" ]; then
            MSG="Imzalama basarisiz oldu."
            CODE="sign"
          fi

          curl -s -X POST -H "X-Secret: $WORKER_SECRET" --data "$MSG" "$WORKER_URL/fail/$JOB_ID?code=$CODE" || true
