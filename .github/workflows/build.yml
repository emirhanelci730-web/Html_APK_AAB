name: Build Android App (.AAB)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Uygulama Adi'
        required: true
      package_name:
        description: 'Paket Adi'
        required: true
      job_id:
        description: 'Is kimligi (Worker verir)'
        required: true
      version_name:
        description: 'Surum adi'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Surum numarasi'
        required: true
        default: '1'
      orientation:
        description: 'Ekran yonu (portrait, landscape, unspecified)'
        required: true
        default: 'unspecified'
      has_icon:
        description: 'Ikon var mi (true, false)'
        required: true
        default: 'false'
      sign_mode:
        description: 'Imzalama (new, own)'
        required: true
        default: 'new'
      splash_color:
        description: 'Acilis ekrani rengi (#rrggbb)'
        required: true
        default: '#12161c'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ github.event.inputs.app_name }}
      PACKAGE_NAME: ${{ github.event.inputs.package_name }}
      JOB_ID: ${{ github.event.inputs.job_id }}
      SIGN_MODE: ${{ github.event.inputs.sign_mode }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Kullanicinin dosyasini al
        id: getfile
        run: |
          echo "$JOB_ID" | grep -Eq '^[0-9a-f-]{36}$' || { echo "Gecersiz is kimligi"; exit 1; }
          curl -sSf -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/zip/$JOB_ID" -o project.zip
          mkdir www
          if unzip -tq project.zip >/dev/null 2>&1; then
            unzip -q project.zip -d www
            rm -rf www/__MACOSX
            if [ ! -f www/index.html ]; then
              found=$(find www -name index.html | head -n 1)
              if [ -n "$found" ]; then
                dir=$(dirname "$found")
                mv "$dir" ./www_new && rm -rf www && mv www_new www
              else
                echo "HATA: ZIP icinde index.html yok"; exit 1
              fi
            fi
          else
            cp project.zip www/index.html
          fi
          ls www

      - name: Capacitor projesini hazirla
        id: cap
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "$APP_NAME" "$PACKAGE_NAME" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Surum, yon ve ikon ayarla
        id: settings
        env:
          VNAME: ${{ github.event.inputs.version_name }}
          VCODE: ${{ github.event.inputs.version_code }}
          ORI: ${{ github.event.inputs.orientation }}
          HAS_ICON: ${{ github.event.inputs.has_icon }}
          SPLASH: ${{ github.event.inputs.splash_color }}
        run: |
          echo "$VNAME" | grep -Eq '^[0-9A-Za-z._-]{1,20}$' || { echo "Gecersiz surum adi"; exit 1; }
          echo "$VCODE" | grep -Eq '^[0-9]{1,10}$' || { echo "Gecersiz surum numarasi"; exit 1; }
          case "$ORI" in portrait|landscape|unspecified) ;; *) echo "Gecersiz yon"; exit 1;; esac

          GRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VCODE/; s/versionName \"[^\"]*\"/versionName \"$VNAME\"/" "$GRADLE"
          grep -n "versionCode\|versionName" "$GRADLE"
          grep -q "versionCode $VCODE" "$GRADLE" || { echo "HATA: surum numarasi degismedi"; exit 1; }

          if [ "$ORI" != "unspecified" ]; then
            sed -i "0,/<activity/s//<activity android:screenOrientation=\"$ORI\"/" android/app/src/main/AndroidManifest.xml
            grep -n "screenOrientation" android/app/src/main/AndroidManifest.xml
          fi

          echo "$SPLASH" | grep -Eq '^#[0-9A-Fa-f]{6}$' || { echo "Gecersiz acilis rengi"; exit 1; }
          SRES=android/app/src/main/res
          find "$SRES" -name 'splash.png' -delete
          mkdir -p "$SRES/drawable"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">\n    <solid android:color="%s"/>\n</shape>\n' "$SPLASH" > "$SRES/drawable/splash.xml"
          if grep -q "Theme.SplashScreen" "$SRES/values/styles.xml" && ! grep -q "windowSplashScreenBackground" "$SRES/values/styles.xml"; then
            sed -i "/AppTheme.NoActionBarLaunch/a <item name=\"windowSplashScreenBackground\">$SPLASH</item>" "$SRES/values/styles.xml"
          fi
          cat "$SRES/values/styles.xml"

          if [ "$HAS_ICON" = "true" ]; then
            sudo apt-get install -y imagemagick >/dev/null
            curl -sSf -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/icon/$JOB_ID" -o icon.png
            RES=android/app/src/main/res
            rm -rf "$RES/mipmap-anydpi-v26"
            for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              d=${pair%%:*}; s=${pair##*:}
              for name in ic_launcher ic_launcher_round; do
                convert icon.png -resize ${s}x${s}^ -gravity center -extent ${s}x${s} "$RES/mipmap-$d/$name.png"
              done
            done
            echo "Ikon degistirildi"
          fi

      - name: Imzalama anahtarini hazirla
        id: keys
        run: |
          KS="$RUNNER_TEMP/upload.jks"
          if [ "$SIGN_MODE" = "own" ]; then
            curl -sSf -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/sign/$JOB_ID" -o "$RUNNER_TEMP/sign.json"
            curl -sSf -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/ukeystore/$JOB_ID" -o "$KS"
            ALIAS=$(jq -r .alias "$RUNNER_TEMP/sign.json")
            SPASS=$(jq -r .storePass "$RUNNER_TEMP/sign.json")
            KPASS=$(jq -r .keyPass "$RUNNER_TEMP/sign.json")
            rm -f "$RUNNER_TEMP/sign.json"
            echo "::add-mask::$SPASS"
            echo "::add-mask::$KPASS"
            keytool -list -keystore "$KS" -storepass "$SPASS" -alias "$ALIAS" >/dev/null 2>&1 \
              || { echo "HATA: anahtar dosyasi, sifre veya takma ad yanlis"; exit 1; }
          else
            SPASS=$(openssl rand -hex 16)
            KPASS="$SPASS"
            ALIAS="upload"
            echo "::add-mask::$SPASS"
            keytool -genkeypair -storetype PKCS12 -keystore "$KS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SPASS" -keypass "$SPASS" -dname "CN=Android, C=TR" >/dev/null 2>&1
            printf 'Uygulama: %s\nPaket adi: %s\nTakma ad (alias): %s\nSifre: %s\n' \
              "$APP_NAME" "$PACKAGE_NAME" "$ALIAS" "$SPASS" > keyinfo.txt
          fi
          echo "ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "KS_PASS=$SPASS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KPASS" >> "$GITHUB_ENV"

      - name: Gradle ile AAB ve APK derle
        id: gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: AAB ve APK dosyalarini imzala
        id: sign
        run: |
          KS="$RUNNER_TEMP/upload.jks"
          JKP=""
          AKP=""
          if [ "$KEY_PASS" != "$KS_PASS" ]; then
            JKP="-keypass:env KEY_PASS"
            AKP="--key-pass env:KEY_PASS"
          fi
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)
          jarsigner -keystore "$KS" -storepass:env KS_PASS $JKP \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            "$AAB" "$ALIAS"
          jarsigner -verify "$AAB"
          cp "$AAB" signed-release.aab
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks "$KS" \
            --ks-key-alias "$ALIAS" --ks-pass env:KS_PASS $AKP \
            --out signed-release.apk aligned.apk
          "$BT/apksigner" verify signed-release.apk

      - name: Dosyalari Worker'a gonder
        run: |
          if [ "$SIGN_MODE" = "new" ]; then
            curl -sSf -X PUT -H "X-Secret: $WORKER_SECRET" \
              --data-binary @"$RUNNER_TEMP/upload.jks" "$WORKER_URL/result/$JOB_ID?type=keystore"
            curl -sSf -X PUT -H "X-Secret: $WORKER_SECRET" \
              --data-binary @keyinfo.txt "$WORKER_URL/result/$JOB_ID?type=keyinfo"
          fi
          curl -sSf -X PUT -H "X-Secret: $WORKER_SECRET" \
            --data-binary @signed-release.apk "$WORKER_URL/result/$JOB_ID?type=apk"
          curl -sSf -X PUT -H "X-Secret: $WORKER_SECRET" \
            --data-binary @signed-release.aab "$WORKER_URL/result/$JOB_ID?type=aab"

      - name: Hata bildir
        if: failure()
        env:
          S_GET: ${{ steps.getfile.outcome }}
          S_CAP: ${{ steps.cap.outcome }}
          S_SET: ${{ steps.settings.outcome }}
          S_KEYS: ${{ steps.keys.outcome }}
          S_GRADLE: ${{ steps.gradle.outcome }}
          S_SIGN: ${{ steps.sign.outcome }}
        run: |
          MSG="Derleme beklenmedik bir sebeple basarisiz oldu."
          [ "$S_GET" = "failure" ] && MSG="Dosya acilamadi. ZIP bozuk olabilir ya da icinde index.html yok."
          [ "$S_CAP" = "failure" ] && MSG="Uygulama olusturulamadi. Uygulama adi veya paket adi gecersiz olabilir."
          [ "$S_SET" = "failure" ] && MSG="Surum, yon, ikon veya acilis rengi ayarlanamadi. Ikon gecerli bir PNG olmayabilir."
          [ "$S_KEYS" = "failure" ] && MSG="Imzalama anahtari acilamadi. Anahtar dosyasi, sifre veya takma ad yanlis olabilir."
          [ "$S_GRADLE" = "failure" ] && MSG="Android derlemesi basarisiz oldu."
          [ "$S_SIGN" = "failure" ] && MSG="Imzalama basarisiz oldu."
          curl -s -X POST -H "X-Secret: $WORKER_SECRET" --data "$MSG" "$WORKER_URL/fail/$JOB_ID" || true
