name: Build Android App (.AAB)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Uygulama Adi'
        required: true
      package_name:
        description: 'Paket Adi'
        required: true
      job_id:
        description: 'Is kimligi (Worker verir)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ github.event.inputs.app_name }}
      PACKAGE_NAME: ${{ github.event.inputs.package_name }}
      JOB_ID: ${{ github.event.inputs.job_id }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Kullanicinin dosyasini al
        run: |
          echo "$JOB_ID" | grep -Eq '^[0-9a-f-]{36}$' || { echo "Gecersiz is kimligi"; exit 1; }
          curl -sSf -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/zip/$JOB_ID" -o project.zip
          mkdir www
          if unzip -tq project.zip >/dev/null 2>&1; then
            unzip -q project.zip -d www
            rm -rf www/__MACOSX
            if [ ! -f www/index.html ]; then
              found=$(find www -name index.html | head -n 1)
              if [ -n "$found" ]; then
                dir=$(dirname "$found")
                mv "$dir" ./www_new && rm -rf www && mv www_new www
              else
                echo "HATA: ZIP icinde index.html yok"; exit 1
              fi
            fi
          else
            cp project.zip www/index.html
          fi
          ls www

      - name: Capacitor projesini hazirla
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "$APP_NAME" "$PACKAGE_NAME" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Gradle ile AAB ve APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: AAB ve APK dosyalarini imzala
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n 1)
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass "$KS_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB"
          cp "$AAB" signed-release.aab
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS \
            --out signed-release.apk aligned.apk
          "$BT/apksigner" verify signed-release.apk
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Dosyalari Worker'a gonder
        run: |
          curl -sSf -X PUT -H "X-Secret: $WORKER_SECRET" \
            --data-binary @signed-release.apk "$WORKER_URL/result/$JOB_ID?type=apk"
          curl -sSf -X PUT -H "X-Secret: $WORKER_SECRET" \
            --data-binary @signed-release.aab "$WORKER_URL/result/$JOB_ID?type=aab"

      - name: Hata bildir
        if: failure()
        run: |
          curl -s -X POST -H "X-Secret: $WORKER_SECRET" "$WORKER_URL/fail/$JOB_ID" || true
