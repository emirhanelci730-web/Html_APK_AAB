name: Build Android App (.AAB)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Uygulama Adi'
        required: true
        default: 'Benim Uygulamam'
      package_name:
        description: 'Paket Adi (örn: com.ornek.oyun)'
        required: true
        default: 'com.ornek.uygulama'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kopyala
        uses: actions/checkout@v4

      - name: Node.js ve Java Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Proje Kurulumu ve Android Platformu
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "${{ github.event.inputs.app_name }}" "${{ github.event.inputs.package_name }}" --web-dir www --npm-client npm
          npx cap add android

      - name: Gradle Derlemesi
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: AAB Dosyasini Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: play-store-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
