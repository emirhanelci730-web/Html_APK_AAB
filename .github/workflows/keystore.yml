name: Keystore Olustur

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Keystore uret
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -genkeypair -storetype PKCS12 -keystore upload.jks \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Upload, C=TR"
          base64 -w 0 upload.jks > keystore_base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            upload.jks
            keystore_base64.txt
          retention-days: 1
